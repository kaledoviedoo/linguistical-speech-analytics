# CI del auditor de framing causal.
#
# Corre SOLO la parte determinista: typecheck y los tests offline. Deliberadamente
# no instala Ollama ni descarga modelos, porque la promesa del proyecto es que esa
# parte corre en la maquina de cada quien. Lo que CI protege es el pipeline:
# parseo, segmentacion, prefiltro, validacion del esquema y generacion del reporte.
#
# Se prueba en Ubuntu y en Windows a proposito: la mitad de los bugs de este
# proyecto fueron especificos de Windows (npm.ps1, spawn con shell, CRLF).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (TypeScript estricto)
        run: npm run typecheck

      - name: Tests offline del pipeline
        run: npm run test:pipeline
